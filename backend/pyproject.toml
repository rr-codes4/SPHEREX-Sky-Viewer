[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astronomy-backend"
version = "0.1.0"
description = "Modular astronomical observation data backend"
requires-python = ">=3.11"
dependencies = [
    "astropy",
    "pyvo",
    "requests",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that contact the live IRSA service",
]
